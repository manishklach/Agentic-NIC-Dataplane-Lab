name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            clang \
            llvm \
            pkg-config \
            libxdp-dev \
            libbpf-dev \
            libibverbs-dev \
            liburing-dev \
            linux-libc-dev
      - name: Build all targets
        run: make all
